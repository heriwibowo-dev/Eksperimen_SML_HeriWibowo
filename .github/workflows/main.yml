name: Advanced ML Workflow

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          
      - name: Check Env
        run: env
        
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run mlflow project
        run: mlflow run .
        
      - name: Get latest MLflow run_id
        run: echo "RUN_ID=..." >> $GITHUB_ENV # Sesuaikan logic pengambilan ID
        
      - name: Upload to Google Drive / Storage
        run: # Gunakan aksi rclone atau gdrive-upload
        
      - name: Build Docker Model
        run: docker build -t your-docker-repo:latest .
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Tag and Push Docker Image
        run: |
          docker tag your-docker-repo:latest your-docker-repo:${{ github.sha }}
          docker push your-docker-repo:latest
          docker push your-docker-repo:${{ github.sha }}
