name: Advanced ML Workflow

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install mlflow docker pytest flake8 dagshub pandas scikit-learn joblib
          
      - name: Test with pytest
        # Mengabaikan exit code 5 (no tests collected) agar workflow tetap sukses
        run: pytest || [ $? -eq 5 ]

      - name: Run training script
        run: python Membangun_model/modelling.py

      - name: Build Docker Model
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ml-model:latest .

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and Push Docker Image
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/ml-model:latest ${{ secrets.DOCKERHUB_USERNAME }}/ml-model:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ml-model:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ml-model:${{ github.sha }}
