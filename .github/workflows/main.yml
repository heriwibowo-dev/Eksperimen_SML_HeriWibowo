name: Advanced ML Workflow

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Check Env
        run: env

      - name: Install dependencies
        run: |
          pip install mlflow docker pytest flake8
          # Tambahkan pip install library lain jika diperlukan oleh modelling.py Anda
          
      - name: Test with pytest
        # Mengabaikan exit code 5 jika tidak ada file tes
        run: pytest || [ $? -eq 5 ]

      - name: Run training script
        # Menggunakan python langsung agar tidak error MLflow entry point
        run: python Membangun_model/modelling.py

      - name: Build Docker Model
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ml-model:latest .

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/ml-model:latest
